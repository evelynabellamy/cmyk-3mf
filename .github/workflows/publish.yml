name: Publish

# Stages a release on npm through trusted publishing (OIDC): no npm token is stored in
# GitHub, provenance is attached automatically, and a maintainer must approve the staged
# version with 2FA on npmjs.com (or `npm stage approve`) before it goes live.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Use an npm CLI that supports staged publishing
        run: npm install -g npm@^11.15.0
      - name: Check the version matches the release tag
        if: github.event_name == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "package.json is ${version} but the release tag is ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Stage the release on npm
        run: npm stage publish --access public
